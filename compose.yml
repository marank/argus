# Argus with PostgreSQL. Configure via .env (see .env.example), then either build the
# image from this repository:
#   docker compose up --build -d
# or run a published image (ARGUS_IMAGE in .env) without the source code:
#   docker compose pull && docker compose up -d --no-build
name: argus

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argus}
      POSTGRES_USER: ${POSTGRES_USER:-argus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    image: ${ARGUS_IMAGE:-argus:latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Use the db service above; credentials come from POSTGRES_* in .env.
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    # Hardening: read-only root filesystem (only /tmp is writable for nginx/gunicorn
    # runtime files) and no privilege escalation via setuid binaries.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # Everything runs unprivileged on port 8080, so no Linux capabilities are needed.
    cap_drop:
      - ALL

  # Nightly pg_dump into the "backups" volume (see docker/backup.sh). Manual dump:
  #   docker compose exec backup sh /backup.sh now
  # Copy dumps off the host: docker compose cp backup:/var/lib/postgresql/backups ./backups
  # Restore: see README, section "Backups".
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    entrypoint: ["sh", "/backup.sh"]
    user: postgres
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-argus}
      PGUSER: ${POSTGRES_USER:-argus}
      PGPASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      TZ: ${TIME_ZONE:-Europe/Berlin}
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./docker/backup.sh:/backup.sh:ro
      # Mounted on the image's postgres-owned home, so the new volume is writable for
      # the postgres user without any capabilities.
      - backups:/var/lib/postgresql
    depends_on:
      db:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  db-data:
  backups:
