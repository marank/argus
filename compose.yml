# Argus with PostgreSQL. Needs only this file and .env (see .env.example):
#   docker compose pull && docker compose up -d
# Runs the published image; for one built from this repository, set
# ARGUS_IMAGE=argus:latest in .env and build it first:
#   docker build -t argus:latest . && docker compose up -d
name: argus

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argus}
      POSTGRES_USER: ${POSTGRES_USER:-argus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ${ARGUS_IMAGE:-ghcr.io/marank/argus:latest}
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Use the db service above; credentials come from POSTGRES_* in .env.
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      # Nightly database dumps (BACKUP_TIME, BACKUP_KEEP_DAYS); see README, "Backups".
      - db-backups:/backups
    # Hardening: read-only root filesystem (only /tmp is writable for nginx/gunicorn
    # runtime files) and no privilege escalation via setuid binaries.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # Everything runs unprivileged on port 8080, so no Linux capabilities are needed.
    cap_drop:
      - ALL

volumes:
  db-data:
  db-backups:
