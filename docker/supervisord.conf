; Keeps nginx, gunicorn and the job worker running; logs go to the container output.
[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:gunicorn]
command=gunicorn config.wsgi:application --config /app/docker/gunicorn.conf.py
directory=/app
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:nginx]
command=nginx -c /app/docker/nginx.conf -g "daemon off;"
autorestart=true
startsecs=2
stopsignal=QUIT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; Background jobs: email delivery, hourly reminders, cleanup (apps/core/tasks.py).
[program:worker]
command=python manage.py procrastinate worker --concurrency 4
directory=/app
autorestart=true
startsecs=3
stopsignal=TERM
stopwaitsecs=30
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
; If a program keeps failing, stop the whole container so Docker's restart
; policy (or the orchestrator) can bring up a fresh one.
[eventlistener:exit-on-fatal]
command=python /app/docker/exit_on_fatal.py
events=PROCESS_STATE_FATAL
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=false
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
