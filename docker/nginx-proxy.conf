# Shared proxy settings; each location names its upstream (proxy_pass) itself.
proxy_http_version 1.1;
proxy_set_header Connection "";
# $http_host keeps the port, which Django's CSRF origin check compares against.
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $forwarded_proto;
# $remote_addr is the real client address (from a trusted proxy's X-Forwarded-For, see
# entrypoint.sh); the backend reads X-Real-IP, a client cannot set it.
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Real-IP $remote_addr;
proxy_read_timeout 120s;
proxy_redirect off;
# Django sets these too; drop its copies so each header is sent once (from nginx).
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
