# nginx for the Argus container: serves the built Vue app and the documentation (/docs/), proxies /api and
# /admin to gunicorn, the live update stream /api/events to uvicorn. Runs unprivileged, so all writable paths live in /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status '
                    '$body_bytes_sent "$http_referer" "$http_user_agent" $request_time';
    access_log /dev/stdout main;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    # Signatures from the pickup terminal are posted as data URLs (at most 600 kB);
    # Django refuses bodies above 2.5 MB anyway.
    client_max_body_size 3m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # $from_trusted_proxy and the real client address (set_real_ip_from) come from
    # TRUSTED_PROXIES, see entrypoint.sh.
    include /tmp/nginx-trusted-proxies.conf;

    # Keep the scheme of a trusted TLS proxy in front of the container; anyone else
    # gets the scheme of their own connection.
    map "$from_trusted_proxy:$http_x_forwarded_proto" $forwarded_proto {
        default  $scheme;
        "1:https" https;
        "1:http"  http;
    }

    # Open live update streams per client address (each holds a connection).
    limit_conn_zone $binary_remote_addr zone=live_streams:1m;

    upstream django {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    # The ASGI process: holds the open live update streams.
    upstream live {
        server 127.0.0.1:8001;
    }

    server {
        listen 8080 default_server;
        server_name _;

        include /app/docker/nginx-security-headers.conf;

        location = /api/events {
            proxy_pass http://live;
            include /app/docker/nginx-proxy.conf;
            # Pass each signal on at once. The stream pings every 20 s, well within
            # proxy_read_timeout.
            proxy_buffering off;
            # Plenty for one person's tabs, or a few people behind one address.
            limit_conn live_streams 30;
        }

        location /api/ {
            proxy_pass http://django;
            include /app/docker/nginx-proxy.conf;
        }

        location /admin/ {
            proxy_pass http://django;
            include /app/docker/nginx-proxy.conf;
        }

        location /django-static/ {
            alias /app/staticfiles/;
            expires 7d;
            access_log off;
        }

        # Vite emits content-hashed file names, so these can be cached for good.
        location /assets/ {
            root /app/frontend;
            access_log off;
            include /app/docker/nginx-security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Documentation (VitePress, docs/): clean URLs map to .html files.
        # Redirects stay relative: an absolute one would name this container's
        # http://…:8080 instead of the address behind the TLS proxy.
        location = /docs {
            absolute_redirect off;
            return 301 /docs/;
        }

        # The German pages lived without a language folder before the docs became
        # bilingual (de/, en/); keep old links and bookmarks working.
        location ~ ^/docs/(employees|approvers|it)(/.*)?$ {
            absolute_redirect off;
            return 301 /docs/de/$1$2$is_args$args;
        }

        location /docs/assets/ {
            root /app;
            access_log off;
            include /app/docker/nginx-security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location /docs/ {
            root /app;
            try_files $uri $uri.html $uri/index.html =404;
            error_page 404 /docs/404.html;
            include /app/docker/nginx-security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }

        # Single page app: unknown paths are client-side routes.
        location / {
            root /app/frontend;
            try_files $uri $uri/ /index.html;
            include /app/docker/nginx-security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }
    }
}
