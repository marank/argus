# nginx for the Argus container: serves the built Vue app and proxies /api and
# /admin to gunicorn, the live update stream /api/events to uvicorn. Runs unprivileged, so all writable paths live in /tmp.

worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" $status '
                    '$body_bytes_sent "$http_referer" "$http_user_agent" $request_time';
    access_log /dev/stdout main;

    client_body_temp_path /tmp/nginx-client-body;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;
    # Signatures from the pickup terminal are posted as data URLs.
    client_max_body_size 10m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    # Keep the scheme of a TLS proxy in front of the container, if any.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }

    upstream django {
        server 127.0.0.1:8000;
        keepalive 16;
    }

    # The ASGI process: holds the open live update streams.
    upstream live {
        server 127.0.0.1:8001;
    }

    server {
        listen 8080 default_server;
        server_name _;

        include /app/docker/nginx-security-headers.conf;

        location = /api/events {
            proxy_pass http://live;
            include /app/docker/nginx-proxy.conf;
            # Pass each signal on at once. The stream pings every 20 s, well within
            # proxy_read_timeout.
            proxy_buffering off;
        }

        location /api/ {
            proxy_pass http://django;
            include /app/docker/nginx-proxy.conf;
        }

        location /admin/ {
            proxy_pass http://django;
            include /app/docker/nginx-proxy.conf;
        }

        location /static/ {
            alias /app/staticfiles/;
            expires 7d;
            access_log off;
        }

        # Vite emits content-hashed file names, so these can be cached for good.
        location /assets/ {
            root /app/frontend;
            access_log off;
            include /app/docker/nginx-security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        # Single page app: unknown paths are client-side routes.
        location / {
            root /app/frontend;
            try_files $uri $uri/ /index.html;
            include /app/docker/nginx-security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }
    }
}
