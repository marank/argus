# Fast checks before each commit; the full set is the VS Code `check` task (and CI).
# Install once: uv tool run pre-commit install   (versions are kept current by Renovate)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]  # pnpm-lock.yaml
      - id: check-json
        exclude: ^(\.vscode/|frontend/tsconfig.*\.json$)  # JSON with comments
      - id: check-merge-conflict
      - id: check-added-large-files
        # Generated from the API (pnpm api:types), large by nature.
        exclude: ^frontend/(openapi\.json|src/api/schema\.d\.ts)$

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.3
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  - repo: local
    hooks:
      - id: frontend-format
        name: prettier (frontend)
        language: system
        entry: bash -c 'cd frontend && pnpm exec prettier --write --experimental-cli --ignore-unknown "${@#frontend/}"' --
        # Same scope as the CI format check (prettier --check src/).
        files: ^frontend/src/
      - id: frontend-oxlint
        name: oxlint (frontend)
        language: system
        entry: bash -c 'cd frontend && pnpm exec oxlint "${@#frontend/}"' --
        files: ^frontend/src/.*\.(ts|vue)$
