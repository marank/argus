# Argus with PostgreSQL. Configure via .env (see .env.example), then:
#   docker compose up --build -d
name: argus

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-argus}
      POSTGRES_USER: ${POSTGRES_USER:-argus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
    image: argus:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # Use the db service above; credentials come from POSTGRES_* in .env.
      DB_HOST: db
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    # Hardening: read-only root filesystem (only /tmp is writable for nginx/gunicorn
    # runtime files) and no privilege escalation via setuid binaries.
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    # Everything runs unprivileged on port 8080, so no Linux capabilities are needed.
    cap_drop:
      - ALL

volumes:
  db-data:
