# Renovate: dependency update PRs for this repository (configuration: renovate.json).
#
# Required repository secrets:
#   RENOVATE_TOKEN  access token of the user that opens the PRs (needs write access to
#                   the repository), with the scopes "write:repository", "write:issue"
#                   (dependency dashboard), "read:organization", "read:user" and
#                   "read:package"
# Optional:
#   GH_COM_TOKEN    read-only github.com token (public repositories, no permissions);
#                   release notes in the PRs and no rate limits when looking up versions
#                   on GitHub. Gitea does not allow secret names starting with GITHUB_.
#
# Runs daily, so open PRs are rebased; renovate.json decides when new PRs open.
name: renovate

on:
  schedule:
    # 03:00 UTC is before 6am in Berlin all year (renovate.json `schedule`)
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ gitea.workflow }}
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/renovatebot/renovate:44.172.1
    env:
      RENOVATE_PLATFORM: gitea
      RENOVATE_ENDPOINT: ${{ gitea.server_url }}/api/v1
      RENOVATE_TOKEN: ${{ secrets.RENOVATE_TOKEN }}
      RENOVATE_REPOSITORIES: ${{ gitea.repository }}
      GITHUB_COM_TOKEN: ${{ secrets.GH_COM_TOKEN }}
      LOG_LEVEL: info
    steps:
      - name: Renovate
        run: renovate
