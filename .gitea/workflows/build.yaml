# Argus CI: lint and test backend + frontend, then build the image and push it
# to the Gitea container registry.
#
# Required repository secrets:
#   REGISTRY_USER   Gitea user that owns (or may write to) the package
#   REGISTRY_TOKEN  access token with the "write:package" scope
#
# Pull requests only run the checks and a test build; pushes to main and
# version tags (v1.2.3) also push the image.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ${{ vars.REGISTRY }}

jobs:
  # --- Backend: ruff, mypy, deptry, licenses, migrations, pytest against PostgreSQL
  backend:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.14-trixie-slim
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: argus
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
        options: >-
          --health-cmd "pg_isready -U argus -d argus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UV_LINK_MODE: copy
      UV_PYTHON_DOWNLOADS: never
      SECRET_KEY: ci-only-not-secret
      # With a SECRET_KEY set, debug would default to off; the tests expect the dev setup.
      DEBUG: "true"
      DB_HOST: postgres
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
    defaults:
      run:
        working-directory: backend
    steps:
      # builtin:checkout runs git inside the job image; the -slim images lack it.
      # working-directory: / because backend/ or frontend/ does not exist yet.
      - name: Install git
        working-directory: /
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - uses: builtin:checkout

      - name: Install dependencies
        # --locked also fails when uv.lock no longer matches pyproject.toml.
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check --output-format=concise .
          uv run ruff format --check .

      - name: Types (mypy)
        run: uv run mypy .

      - name: Dependencies (deptry)
        run: uv run deptry .

      # No GPL/AGPL/SSPL in production dependencies (LGPL is fine). Checked in a
      # throwaway venv with only the production dependencies installed.
      - name: Licenses
        run: |
          LICENSE_DIR=$(mktemp -d)
          trap 'rm -rf "$LICENSE_DIR"' EXIT
          uv export --locked --no-dev --no-hashes --format requirements.txt -o "$LICENSE_DIR/requirements.txt"
          uv venv --quiet "$LICENSE_DIR/venv"
          uv pip install --quiet --python "$LICENSE_DIR/venv" -r "$LICENSE_DIR/requirements.txt" pip-licenses
          "$LICENSE_DIR/venv/bin/pip-licenses" --format=json \
            --ignore-packages pip-licenses prettytable wcwidth \
            | uv run python scripts/check_licenses.py

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: uv run python manage.py check

      # Coverage minimum: fail_under in pyproject.toml.
      - name: Tests
        run: uv run pytest -q --cov

  # --- Frontend: lint (oxlint, eslint, knip), prettier, types, vitest, licenses, size
  frontend:
    runs-on: ubuntu-latest
    container:
      image: node:24-trixie-slim
    defaults:
      run:
        working-directory: frontend
    steps:
      # builtin:checkout runs git inside the job image; the -slim images lack it.
      # working-directory: / because backend/ or frontend/ does not exist yet.
      - name: Install git
        working-directory: /
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - uses: builtin:checkout

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Lint
        run: |
          pnpm lint
          pnpm format:check

      - name: Type-check
        run: pnpm type-check

      # Coverage minimum: thresholds in vitest.config.ts.
      - name: Unit tests
        run: pnpm test:coverage

      - name: Licenses
        run: pnpm check:licenses

      # Budget in package.json ("size-limit"); the image build type-checks again.
      - name: Bundle size
        run: |
          pnpm build-only
          pnpm size

  # --- Image: build, smoke-test, push -------------------------------------------
  image:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILDKIT: "1"
      PUSH: ${{ gitea.event_name != 'pull_request' }}
    steps:
      - uses: builtin:checkout

      - name: Compute tags
        id: meta
        # Context values go in via env, never straight into the script: tag names
        # may contain shell metacharacters.
        env:
          REPO: ${{ gitea.repository }}
          REF: ${{ gitea.ref }}
          REF_NAME: ${{ gitea.ref_name }}
          SHA: ${{ gitea.sha }}
        run: |
          IMAGE=$(echo "$REGISTRY/$REPO" | tr 'A-Z' 'a-z')
          SHORT_SHA=$(echo "$SHA" | cut -c1-12)
          TAGS="$IMAGE:sha-$SHORT_SHA"
          case "$REF" in
            refs/heads/main)
              TAGS="$TAGS $IMAGE:latest"
              ;;
            refs/tags/v*)
              VERSION="${REF_NAME#v}"
              # Only docker-safe tag names; the tags end up in later scripts.
              if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
                echo "Invalid version tag: $REF_NAME" >&2
                exit 1
              fi
              TAGS="$TAGS $IMAGE:$VERSION"
              # Also tag 1.2 and 1 for plain releases (no -rc/-beta suffix).
              if echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                TAGS="$TAGS $IMAGE:${VERSION%.*} $IMAGE:${VERSION%%.*}"
              fi
              ;;
          esac
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Tags: $TAGS"

      - name: Login
        if: env.PUSH == 'true'
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Build
        run: |
          TAG_ARGS=""
          for t in ${{ steps.meta.outputs.tags }}; do TAG_ARGS="$TAG_ARGS -t $t"; done
          # Reuse layers from the last pushed image when there is one.
          docker pull "${{ steps.meta.outputs.image }}:latest" || true
          docker build --pull \
            --cache-from "${{ steps.meta.outputs.image }}:latest" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --label "org.opencontainers.image.source=${{ gitea.server_url }}/${{ gitea.repository }}" \
            --label "org.opencontainers.image.revision=${{ gitea.sha }}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            $TAG_ARGS .

      # Start the image against a throwaway PostgreSQL (like compose.yml)
      # and wait for the health endpoint, so an image that cannot boot (entrypoint,
      # migrations, nginx/gunicorn) is never pushed. Then check that it stays up and
      # that the job worker and the live update process (uvicorn) run: a program that
      # keeps failing stops the container (docker/exit_on_fatal.py).
      - name: Smoke test
        run: |
          IMAGE="${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}"
          NAME="argus-smoke-${{ gitea.run_id }}"
          docker network create "$NAME"
          trap 'docker logs "$NAME" || true; docker rm -f "$NAME" "$NAME-db" >/dev/null 2>&1 || true; docker network rm "$NAME" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$NAME-db" --network "$NAME" --network-alias db \
            -e POSTGRES_DB=argus -e POSTGRES_USER=argus -e POSTGRES_PASSWORD=argus \
            postgres:18-alpine
          docker run -d --name "$NAME" --network "$NAME" \
            --read-only --tmpfs /tmp --security-opt no-new-privileges:true \
            -e SECRET_KEY=ci-smoke-test-not-secret-but-long-enough-for-the-check -e DB_HOST=db \
            -e POSTGRES_DB=argus -e POSTGRES_USER=argus -e POSTGRES_PASSWORD=argus \
            "$IMAGE"
          healthy=false
          for i in $(seq 1 45); do
            if docker exec "$NAME" curl -fsS http://127.0.0.1:8080/api/health; then
              echo; echo "Healthy after ${i}x2s"; healthy=true; break
            fi
            sleep 2
          done
          if [ "$healthy" != true ]; then
            echo "Container did not become healthy" >&2
            exit 1
          fi

          # Long enough for supervisord to give up on a crashing program.
          sleep 20
          docker exec "$NAME" curl -fsS http://127.0.0.1:8080/api/health
          echo
          # [x]yz: the pattern does not match the grep process itself.
          for program in "[p]rocrastinate" "[u]vicorn"; do
            if ! docker exec "$NAME" sh -c "grep -qa '$program' /proc/[0-9]*/cmdline"; then
              echo "Not running: $program" >&2
              exit 1
            fi
          done
          # Routed by nginx to uvicorn; without a session the stream refuses.
          status=$(docker exec "$NAME" curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/events)
          if [ "$status" != 401 ]; then
            echo "/api/events answered $status instead of 401" >&2
            exit 1
          fi
          echo "Worker and live update stream are up"

      # Known vulnerabilities (OS packages, Python wheels) and secrets baked into the image.
      # Report only for now: add `--exit-code 1` to block the push once the findings are triaged.
      # The vulnerability database is cached in a volume of the runner's Docker.
      - name: Vulnerability scan
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v argus-trivy-cache:/root/.cache/trivy \
            aquasec/trivy:0.76.0 image \
            --scanners vuln,secret \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --no-progress \
            "${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}"

      - name: Push
        if: env.PUSH == 'true'
        run: |
          for t in ${{ steps.meta.outputs.tags }}; do docker push "$t"; done

      - name: Logout
        if: always() && env.PUSH == 'true'
        run: docker logout "$REGISTRY"
