[project]
name = "argus-backend"
version = "0.1.0"
description = "Argus – IT asset management (Django backend)"
requires-python = ">=3.14"
dependencies = [
    "django[argon2]>=6.1.2",
    "django-ninja>=1.7.1",
    "gunicorn>=26.2.0",
    "ldap3>=2.9.1",
    "procrastinate[django]>=3.10.0",
    "psycopg[binary]>=3.3.6",
    "segno>=1.6",
    "uvicorn>=0.54.0",
    "django-stubs-ext>=6.1.2",
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "deptry>=0.25.1",
    "django-stubs>=6.1.2",
    "mypy>=2.4.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false
# ldap3 2.9 imports pyasn1 names deprecated in 0.6; keep pyasn1 below the release that drops them.
constraint-dependencies = ["pyasn1<0.7"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
filterwarnings = ["ignore:(tagMap|typeMap) is deprecated:DeprecationWarning:ldap3"]
# In parallel (pytest-xdist); more than 8 workers only add start-up time. One file: -n0.
addopts = "-n auto --maxprocesses=8"

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["E501"]

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
fail_under = 90
skip_covered = true
show_missing = true

[tool.deptry]
# Tests may use dev dependencies (pytest) and what Django brings along (asgiref).
extend_exclude = [".*/tests/", "conftest\\.py"]

[tool.deptry.per_rule_ignores]
# Used at runtime, never imported: the WSGI and ASGI servers.
DEP002 = ["gunicorn", "uvicorn"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
exclude = ["/migrations/"]
strict = true

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[[tool.mypy.overrides]]
# Tests: still type-checked, but test functions and fixtures need no annotations.
module = ["apps.*.tests.*", "conftest"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
# No type information published for ldap3.
module = ["ldap3", "ldap3.*"]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings"
