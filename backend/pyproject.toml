[project]
name = "argus-backend"
version = "0.1.0"
description = "Argus – IT asset management (Django backend)"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "django-ninja>=1.7.1",
    "gunicorn>=26.2.0",
    "ldap3>=2.9.1",
    "procrastinate[django]>=3.10.0",
    "psycopg[binary]>=3.3.6",
    "segno>=1.6",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-django>=4.14.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.1",
]

[tool.uv]
package = false
# ldap3 2.9 imports pyasn1 names deprecated in 0.6; keep pyasn1 below the release that drops them.
constraint-dependencies = ["pyasn1<0.7"]

[tool.ruff]
line-length = 110
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
filterwarnings = ["ignore:(tagMap|typeMap) is deprecated:DeprecationWarning:ldap3"]
# In parallel (pytest-xdist); more than 8 workers only add start-up time. One file: -n0.
addopts = "-n auto --maxprocesses=8"

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["E501"]
