# Argus CI: lint and test backend + frontend, build the docs, then build the image and push it
# to the GitHub container registry (ghcr.io/<owner>/<repository>).
#
# No secrets needed: the push uses the workflow's GITHUB_TOKEN.
#
# Pull requests (also from forks) only run the checks and a test build; pushes to main
# and version tags (v1.2.3) also push the image. release.yaml calls this workflow with the
# version after release-please has tagged a release. Once a week main is built and pushed
# again even without a change, so the image gets Debian's security fixes and a scan
# that finds new vulnerabilities turns the run red.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 03:17 UTC (off the full hour, when GitHub's scheduler is busiest).
    - cron: "17 3 * * 1"
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        description: Release version (1.2.3) to tag the image with
        type: string
        required: true

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job asks for what it needs.
permissions: {}

env:
  REGISTRY: ghcr.io
  # Started with `docker run`, so Dependabot does not see them: update tag and digest by hand
  # (POSTGRES_IMAGE: the same major as compose.yml, which names it by tag only).
  TRIVY_IMAGE: aquasec/trivy:0.76.0@sha256:2416d1f74045b57274df1a340eee6b510cacd73c66a6ccb8da092b117eb7d222
  POSTGRES_IMAGE: postgres:18-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
  # The check jobs only run justfile recipes (`just check` locally). Not seen by Dependabot.
  JUST_VERSION: "1.59.0"

jobs:
  # --- Backend: `just check-backend` against PostgreSQL, then `just check-deploy`
  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ghcr.io/astral-sh/uv:python3.14-trixie-slim@sha256:da0f1f04404173d7d2fa158112e09624d5a80262efa86c89882b68389dfd44eb
    services:
      postgres:
        image: postgres:18-alpine@sha256:ff64c9e3bdf8e2120107d3559de8db314e8305f7e38c5105903c6295876738ff
        env:
          POSTGRES_DB: argus
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
        options: >-
          --health-cmd "pg_isready -U argus -d argus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UV_LINK_MODE: copy
      UV_PYTHON_DOWNLOADS: never
      DB_HOST: postgres
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
    steps:
      # actions/checkout needs git inside the job image (the -slim images lack it); the
      # translation check needs gettext (makemessages).
      - name: Install git and gettext
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates gettext

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checks
        run: uvx --from "rust-just==$JUST_VERSION" just check-backend

      - name: Deploy checks
        run: uvx --from "rust-just==$JUST_VERSION" just check-deploy

  # --- Frontend: `just check-frontend`
  frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: node:26-trixie-slim@sha256:e6bedef217677b276c591795e169840edd9096dbf13f29df8ef8d1856b8820bc
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The checkout belongs to the runner's user, the container runs as root; the check
      # compares the generated API types with git.
      - name: Trust the checkout
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      # pnpm in the version of packageManager (exact, like the Dockerfile); Node 25+ no
      # longer ships corepack.
      - name: Checks
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g "$(node -p "require('./frontend/package.json').packageManager")"
          npx --yes "rust-just@$JUST_VERSION" check-frontend

  # --- Docs: `just check-docs` (dead links, anchors, IT links in the open areas, translations)
  docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: node:26-trixie-slim@sha256:e6bedef217677b276c591795e169840edd9096dbf13f29df8ef8d1856b8820bc
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checks
        run: | # zizmor: ignore[adhoc-packages]
          npm install -g "$(node -p "require('./docs/package.json').packageManager")"
          npx --yes "rust-just@$JUST_VERSION" check-docs

  # --- Workflows: `just check-workflows` (actionlint, zizmor)
  workflows:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: ghcr.io/astral-sh/uv:python3.14-trixie-slim@sha256:da0f1f04404173d7d2fa158112e09624d5a80262efa86c89882b68389dfd44eb
    steps:
      - name: Install git
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checks
        run: uvx --from "rust-just==$JUST_VERSION" just check-workflows

  # --- Repository: secrets, vulnerable dependencies, Dockerfile misconfiguration --
  repository:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Secrets, critical fixable vulnerabilities in the lock files and HIGH/CRITICAL
      # Dockerfile misconfigurations fail; HIGH vulnerabilities are reported. The files
      # are streamed into the scanner as a tar archive, which works whether or not the
      # runner's Docker daemon can see this checkout. The vulnerability database is
      # cached in a volume of the runner's Docker.
      - name: Scan
        run: |
          trivy() {
            tar -c --exclude=.git --exclude=node_modules --exclude=.venv . \
              | docker run --rm -i -v argus-trivy-cache:/root/.cache/trivy \
                  --entrypoint sh "$TRIVY_IMAGE" -c \
                  'mkdir /src && tar -x -C /src &&
                   test -f /src/Dockerfile -a -f /src/backend/uv.lock || { echo "nothing to scan" >&2; exit 2; }
                   exec trivy fs --no-progress --skip-version-check "$@" /src' \
                  trivy "$@"
          }
          trivy --scanners secret --exit-code 1
          trivy --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1
          trivy --scanners misconfig --severity HIGH,CRITICAL --exit-code 1
          trivy --scanners vuln --severity HIGH

  # --- Image: build, smoke-test, scan, push -------------------------------------
  image:
    needs: [backend, frontend, docs, workflows, repository]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILDKIT: "1"
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compute tags
        # Context values go in via env, never straight into the script: tag names
        # may contain shell metacharacters.
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RELEASE: ${{ inputs.version }}
        run: |
          # Called by release.yaml: tag like a pushed version tag.
          if [ -n "$RELEASE" ]; then
            REF="refs/tags/v$RELEASE"
            REF_NAME="v$RELEASE"
          fi
          IMAGE=$(echo "$REGISTRY/$REPO" | tr 'A-Z' 'a-z')
          SHORT_SHA=$(echo "$SHA" | cut -c1-12)
          TAGS="$IMAGE:sha-$SHORT_SHA"
          case "$REF" in
            refs/heads/main)
              TAGS="$TAGS $IMAGE:latest"
              ;;
            refs/tags/v*)
              VERSION="${REF_NAME#v}"
              # Only docker-safe tag names; the tags end up in later scripts.
              if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
                echo "Invalid version tag: $REF_NAME" >&2
                exit 1
              fi
              TAGS="$TAGS $IMAGE:$VERSION"
              # Also tag 1.2 and 1 for plain releases (no -rc/-beta suffix).
              if echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                TAGS="$TAGS $IMAGE:${VERSION%.*} $IMAGE:${VERSION%%.*}"
              fi
              ;;
          esac
          # For the later steps as environment variables, never expanded into their scripts.
          {
            echo "IMAGE=$IMAGE"
            echo "SHORT_SHA=$SHORT_SHA"
            echo "TAGS=$TAGS"
          } >> "$GITHUB_ENV"
          echo "Tags: $TAGS"

      - name: Login
        if: env.PUSH == 'true'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Build
        run: |
          TAG_ARGS=""
          for t in $TAGS; do TAG_ARGS="$TAG_ARGS -t $t"; done
          # Reuse layers from the last pushed image when there is one, except for the
          # runtime stage: its system packages are installed anew, so security fixes are
          # not held back by the cache.
          docker pull "$IMAGE:latest" || true
          docker build --pull --no-cache-filter runtime \
            --cache-from "$IMAGE:latest" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            $TAG_ARGS .

      # Start the image against a throwaway PostgreSQL (like compose.yml) and wait for
      # the health endpoint, so an image that cannot boot (entrypoint, migrations,
      # nginx/gunicorn) is never pushed. After a pause long enough for a crashing program
      # to stop the container (docker/exit_on_fatal.py), docker/smoke-test probes it
      # from inside: routes, every program running, a backup, no root, read-only.
      - name: Smoke test
        run: |
          TESTED="$IMAGE:sha-$SHORT_SHA"
          NAME="argus-smoke-$GITHUB_RUN_ID"
          docker network create "$NAME"
          trap 'docker logs "$NAME" || true; docker rm -fv "$NAME" "$NAME-db" >/dev/null 2>&1 || true; docker network rm "$NAME" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$NAME-db" --network "$NAME" --network-alias db \
            -e POSTGRES_DB=argus -e POSTGRES_USER=argus -e POSTGRES_PASSWORD=argus \
            "$POSTGRES_IMAGE"
          docker run -d --name "$NAME" --network "$NAME" \
            --read-only --tmpfs /tmp --security-opt no-new-privileges:true --cap-drop ALL \
            --mount type=volume,target=/backups \
            -e SECRET_KEY=ci-smoke-test-not-secret-but-long-enough-for-the-check -e DB_HOST=db \
            -e POSTGRES_DB=argus -e POSTGRES_USER=argus -e POSTGRES_PASSWORD=argus \
            "$TESTED"
          healthy=false
          for i in $(seq 1 45); do
            if docker exec "$NAME" curl -fsS http://127.0.0.1:8080/api/health; then
              echo; echo "Healthy after ${i}x2s"; healthy=true; break
            fi
            sleep 2
          done
          if [ "$healthy" != true ]; then
            echo "Container did not become healthy" >&2
            exit 1
          fi

          # Long enough for supervisord to give up on a crashing program.
          sleep 20
          docker exec "$NAME" sh /app/docker/smoke-test

      # Known vulnerabilities (OS packages, Python wheels) and secrets baked into the image.
      # Secrets and critical vulnerabilities with an available fix block the push; HIGH
      # ones are reported (fixes for Debian packages arrive with the next base image,
      # which `docker build --pull` picks up). The database is cached in a volume.
      - name: Vulnerability scan
        run: |
          scan() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v argus-trivy-cache:/root/.cache/trivy \
              "$TRIVY_IMAGE" image --no-progress --skip-version-check "$@" \
              "$IMAGE:sha-$SHORT_SHA"
          }
          scan --scanners secret --exit-code 1
          scan --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1
          scan --scanners vuln --severity HIGH --ignore-unfixed

      - name: Push
        if: env.PUSH == 'true'
        run: |
          for t in $TAGS; do docker push "$t"; done

      - name: Logout
        if: always() && env.PUSH == 'true'
        run: docker logout "$REGISTRY"
