# Argus CI: lint and test backend + frontend, build the docs, then build the image and push it
# to the GitHub container registry (ghcr.io/<owner>/<repository>).
#
# No secrets needed: the push uses the workflow's GITHUB_TOKEN.
#
# Pull requests (also from forks) only run the checks and a test build; pushes to main
# and version tags (v1.2.3) also push the image. Once a week main is built and pushed
# again even without a change, so the image gets Debian's security fixes and a scan
# that finds new vulnerabilities turns the run red.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  schedule:
    # Mondays 03:17 UTC (off the full hour, when GitHub's scheduler is busiest).
    - cron: "17 3 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  TRIVY_IMAGE: aquasec/trivy:0.76.0

jobs:
  # --- Backend: ruff, mypy, deptry, licenses, migrations, pytest against PostgreSQL
  backend:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/astral-sh/uv:python3.14-trixie-slim
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: argus
          POSTGRES_USER: argus
          POSTGRES_PASSWORD: argus
        options: >-
          --health-cmd "pg_isready -U argus -d argus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      UV_LINK_MODE: copy
      UV_PYTHON_DOWNLOADS: never
      SECRET_KEY: ci-only-not-secret
      # With a SECRET_KEY set, debug would default to off; the tests expect the dev setup.
      DEBUG: "true"
      DB_HOST: postgres
      POSTGRES_DB: argus
      POSTGRES_USER: argus
      POSTGRES_PASSWORD: argus
    defaults:
      run:
        working-directory: backend
    steps:
      # actions/checkout needs git inside the job image; the -slim images lack it.
      # working-directory: / because backend/ or frontend/ does not exist yet.
      - name: Install git
        working-directory: /
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v7

      - name: Install dependencies
        # --locked also fails when uv.lock no longer matches pyproject.toml.
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check --output-format=concise .
          uv run ruff format --check .

      - name: Types (mypy)
        run: uv run mypy .

      - name: Dependencies (deptry)
        run: uv run deptry .

      # No GPL/AGPL/SSPL in production dependencies (LGPL is fine). Checked in a
      # throwaway venv with only the production dependencies installed.
      - name: Licenses
        run: |
          LICENSE_DIR=$(mktemp -d)
          trap 'rm -rf "$LICENSE_DIR"' EXIT
          uv export --locked --no-dev --no-hashes --format requirements.txt -o "$LICENSE_DIR/requirements.txt"
          uv venv --quiet "$LICENSE_DIR/venv"
          uv pip install --quiet --python "$LICENSE_DIR/venv" -r "$LICENSE_DIR/requirements.txt" pip-licenses
          "$LICENSE_DIR/venv/bin/pip-licenses" --format=json \
            --ignore-packages pip-licenses prettytable wcwidth \
            | uv run python scripts/check_licenses.py

      - name: Check for missing migrations
        run: uv run python manage.py makemigrations --check --dry-run

      # The frontend's generated types come from this file (pnpm api:types).
      - name: OpenAPI schema up to date
        run: |
          uv run python manage.py export_openapi /tmp/openapi.json
          cmp /tmp/openapi.json ../frontend/openapi.json \
            || { echo "API changed: run the VS Code task 'API: update types' and commit both files" >&2; exit 1; }

      - name: Django system checks
        run: uv run python manage.py check

      # Production settings as behind a TLS proxy: no warning may remain (HSTS and the
      # https redirect belong to the proxy, see SILENCED_SYSTEM_CHECKS).
      - name: Django deploy checks
        env:
          DEBUG: "false"
          SECRET_KEY: ci-deploy-check-not-secret-but-long-and-random-enough-0123456789abcdef
          APP_URLS: https://argus.example.com
          BEHIND_PROXY: "true"
        run: uv run python manage.py check --deploy --fail-level WARNING

      # Coverage minimum: fail_under in pyproject.toml.
      - name: Tests
        run: uv run pytest -q --cov

  # --- Frontend: lint (oxlint, eslint, knip), prettier, types, vitest, licenses, size
  frontend:
    runs-on: ubuntu-latest
    container:
      image: node:24-trixie-slim
    defaults:
      run:
        working-directory: frontend
    steps:
      # actions/checkout needs git inside the job image; the -slim images lack it.
      # working-directory: / because backend/ or frontend/ does not exist yet.
      - name: Install git
        working-directory: /
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: API types up to date
        run: |
          cp src/api/schema.d.ts /tmp/schema.d.ts
          pnpm api:types
          cmp src/api/schema.d.ts /tmp/schema.d.ts \
            || { echo "src/api/schema.d.ts does not match openapi.json: run pnpm api:types" >&2; exit 1; }

      - name: Lint
        run: |
          pnpm lint
          pnpm format:check

      - name: Type-check
        run: pnpm type-check

      # Coverage minimum: thresholds in vitest.config.ts.
      - name: Unit tests
        run: pnpm test:coverage

      - name: Licenses
        run: pnpm check:licenses

      # Budget in package.json ("size-limit"); the image build type-checks again.
      - name: Bundle size
        run: |
          pnpm build-only
          pnpm size

  # --- Docs: VitePress build (fails on dead links, anchors and IT links in the employee areas) -------------------------------
  docs:
    runs-on: ubuntu-latest
    container:
      image: node:24-trixie-slim
    defaults:
      run:
        working-directory: docs
    steps:
      - name: Install git
        working-directory: /
        run: apt-get update && apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  # --- Repository: secrets, vulnerable dependencies, Dockerfile misconfiguration --
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Secrets, critical fixable vulnerabilities in the lock files and HIGH/CRITICAL
      # Dockerfile misconfigurations fail; HIGH vulnerabilities are reported. The files
      # are streamed into the scanner as a tar archive, which works whether or not the
      # runner's Docker daemon can see this checkout. The vulnerability database is
      # cached in a volume of the runner's Docker.
      - name: Scan
        run: |
          trivy() {
            tar -c --exclude=.git --exclude=node_modules --exclude=.venv . \
              | docker run --rm -i -v argus-trivy-cache:/root/.cache/trivy \
                  --entrypoint sh "$TRIVY_IMAGE" -c \
                  'mkdir /src && tar -x -C /src &&
                   test -f /src/Dockerfile -a -f /src/backend/uv.lock || { echo "nothing to scan" >&2; exit 2; }
                   exec trivy fs --no-progress --skip-version-check "$@" /src' \
                  trivy "$@"
          }
          trivy --scanners secret --exit-code 1
          trivy --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1
          trivy --scanners misconfig --severity HIGH,CRITICAL --exit-code 1
          trivy --scanners vuln --severity HIGH

  # --- Image: build, smoke-test, scan, push -------------------------------------
  image:
    needs: [backend, frontend, docs, repository]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_BUILDKIT: "1"
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7

      - name: Compute tags
        id: meta
        # Context values go in via env, never straight into the script: tag names
        # may contain shell metacharacters.
        env:
          REPO: ${{ github.repository }}
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          IMAGE=$(echo "$REGISTRY/$REPO" | tr 'A-Z' 'a-z')
          SHORT_SHA=$(echo "$SHA" | cut -c1-12)
          TAGS="$IMAGE:sha-$SHORT_SHA"
          case "$REF" in
            refs/heads/main)
              TAGS="$TAGS $IMAGE:latest"
              ;;
            refs/tags/v*)
              VERSION="${REF_NAME#v}"
              # Only docker-safe tag names; the tags end up in later scripts.
              if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
                echo "Invalid version tag: $REF_NAME" >&2
                exit 1
              fi
              TAGS="$TAGS $IMAGE:$VERSION"
              # Also tag 1.2 and 1 for plain releases (no -rc/-beta suffix).
              if echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
                TAGS="$TAGS $IMAGE:${VERSION%.*} $IMAGE:${VERSION%%.*}"
              fi
              ;;
          esac
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"
          echo "Tags: $TAGS"

      - name: Login
        if: env.PUSH == 'true'
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$REGISTRY_TOKEN" | docker login "$REGISTRY" -u "$REGISTRY_USER" --password-stdin

      - name: Build
        run: |
          TAG_ARGS=""
          for t in ${{ steps.meta.outputs.tags }}; do TAG_ARGS="$TAG_ARGS -t $t"; done
          # Reuse layers from the last pushed image when there is one; the system packages
          # are installed anew each day (APT_REFRESH), so security fixes are not held back
          # by the cache.
          docker pull "${{ steps.meta.outputs.image }}:latest" || true
          docker build --pull \
            --cache-from "${{ steps.meta.outputs.image }}:latest" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --build-arg APT_REFRESH="$(date -u +%F)" \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            $TAG_ARGS .

      # Start the image against a throwaway PostgreSQL (like compose.yml)
      # and wait for the health endpoint, so an image that cannot boot (entrypoint,
      # migrations, nginx/gunicorn) is never pushed. Then check that it stays up and
      # that the job worker and the live update process (uvicorn) run: a program that
      # keeps failing stops the container (docker/exit_on_fatal.py). Finally a backup:
      # pg_dump must accept the server's version and write into a fresh volume.
      - name: Smoke test
        run: |
          IMAGE="${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}"
          NAME="argus-smoke-${{ github.run_id }}"
          docker network create "$NAME"
          trap 'docker logs "$NAME" || true; docker rm -fv "$NAME" "$NAME-db" >/dev/null 2>&1 || true; docker network rm "$NAME" >/dev/null 2>&1 || true' EXIT
          docker run -d --name "$NAME-db" --network "$NAME" --network-alias db \
            -e POSTGRES_DB=argus -e POSTGRES_USER=argus -e POSTGRES_PASSWORD=argus \
            postgres:18-alpine
          docker run -d --name "$NAME" --network "$NAME" \
            --read-only --tmpfs /tmp --security-opt no-new-privileges:true --cap-drop ALL \
            --mount type=volume,target=/backups \
            -e SECRET_KEY=ci-smoke-test-not-secret-but-long-enough-for-the-check -e DB_HOST=db \
            -e POSTGRES_DB=argus -e POSTGRES_USER=argus -e POSTGRES_PASSWORD=argus \
            "$IMAGE"
          healthy=false
          for i in $(seq 1 45); do
            if docker exec "$NAME" curl -fsS http://127.0.0.1:8080/api/health; then
              echo; echo "Healthy after ${i}x2s"; healthy=true; break
            fi
            sleep 2
          done
          if [ "$healthy" != true ]; then
            echo "Container did not become healthy" >&2
            exit 1
          fi

          # Long enough for supervisord to give up on a crashing program.
          sleep 20
          docker exec "$NAME" curl -fsS http://127.0.0.1:8080/api/health
          echo
          # [x]yz: the pattern does not match the grep process itself.
          for program in "[p]rocrastinate" "[u]vicorn"; do
            if ! docker exec "$NAME" sh -c "grep -qa '$program' /proc/[0-9]*/cmdline"; then
              echo "Not running: $program" >&2
              exit 1
            fi
          done
          # Routed by nginx to uvicorn; without a session the stream refuses.
          status=$(docker exec "$NAME" curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/events)
          if [ "$status" != 401 ]; then
            echo "/api/events answered $status instead of 401" >&2
            exit 1
          fi
          docker exec "$NAME" python manage.py backup_database
          echo "Worker and live update stream are up"

      # Known vulnerabilities (OS packages, Python wheels) and secrets baked into the image.
      # Secrets and critical vulnerabilities with an available fix block the push; HIGH
      # ones are reported (fixes for Debian packages arrive with the next base image,
      # which `docker build --pull` picks up). The database is cached in a volume.
      - name: Vulnerability scan
        run: |
          scan() {
            docker run --rm \
              -v /var/run/docker.sock:/var/run/docker.sock \
              -v argus-trivy-cache:/root/.cache/trivy \
              "$TRIVY_IMAGE" image --no-progress --skip-version-check "$@" \
              "${{ steps.meta.outputs.image }}:sha-${{ steps.meta.outputs.short_sha }}"
          }
          scan --scanners secret --exit-code 1
          scan --scanners vuln --severity CRITICAL --ignore-unfixed --exit-code 1
          scan --scanners vuln --severity HIGH --ignore-unfixed

      - name: Push
        if: env.PUSH == 'true'
        run: |
          for t in ${{ steps.meta.outputs.tags }}; do docker push "$t"; done

      - name: Logout
        if: always() && env.PUSH == 'true'
        run: docker logout "$REGISTRY"
