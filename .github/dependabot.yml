# Weekly dependency updates, minor and patch versions in one pull request per area. A release
# is only taken once it is a week old, so a compromised one is usually pulled before it arrives.
# Commit messages are Conventional Commits (release-please reads them): deps for what ends
# up in the image or with operators (a patch release, listed under "Dependencies"),
# chore(deps) for development tools and CI (no release).
version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    # Runtime updates end up in the image: release-please makes a patch release.
    commit-message:
      prefix: "deps"
      prefix-development: "chore(deps)"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      backend:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /frontend
    # Runtime updates end up in the image: release-please makes a patch release.
    commit-message:
      prefix: "deps"
      prefix-development: "chore(deps)"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      frontend:
        update-types: [minor, patch]
    ignore:
      # Stays on Node 24 types while development may run on Node 24 (the images run 26).
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /docs
    # Only builds the documentation site: no release of its own.
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      docs:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    # Base images of the image: release-please makes a patch release.
    commit-message:
      prefix: "deps"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7

  - package-ecosystem: docker-compose
    directory: /
    # What operators run with compose.yml.
    commit-message:
      prefix: "deps"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      # A PostgreSQL major upgrade needs a dump and restore of the data.
      - dependency-name: postgres
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    commit-message:
      prefix: "chore(deps)"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
